[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-jev"
version = "0.1.0"
description = "Qwen3.5-based multimodal candidate extraction and typed decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.6", "torchvision>=0.21", "transformers>=5.17,<6", "peft>=0.18", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
vision-jev = "vision_jev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/arnodjiang/Vision-JEV"
Repository = "https://github.com/arnodjiang/Vision-JEV"
Issues = "https://github.com/arnodjiang/Vision-JEV/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
